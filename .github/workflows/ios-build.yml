# ios-build.yml
# TuneBox
#
# Created by Vadim Sorokolit on 17.06.2026.

name: iOS Build

on:
  push:
    branches:
      - main
      - develop
      - features/downloads-view-model

  pull_request:

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Checkout repository
        uses: actions/actions/checkout@v5

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode.app

      - name: Build TuneBox
        run: |
          xcodebuild clean build \
          -project TuneBox/TuneBox.xcodeproj \
          -scheme TuneBox \
          -destination 'generic/platform=iOS Simulator' \
          -skipPackagePluginValidation
