switch_case_alignment:
  indented_cases: true

line_length:
  warning: 140
  error: 200
  ignores_comments: true
  ignores_urls: true

vertical_whitespace:
  max_empty_lines: 1

type_body_length:
  warning: 1400
  error: 1600

cyclomatic_complexity:
  warning: 20
  error: 30

function_body_length:
  warning: 100
  error: 150

file_length:
  warning: 1800
  error: 2000

function_parameter_count:
  warning: 5
  error: 12

nesting:
  type_level: 4

disabled_rules:
  - for_where
  - large_tuple
